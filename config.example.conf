# VPS Traffic Monitor — 通用配置模板
# 复制为 /root/vps-traffic-monitor/config.conf 后修改
#   cp config.example.conf /root/vps-traffic-monitor/config.conf

INSTANCE_NAME="my-vps"
INTERFACE=""
METRIC="up"
RESET_DAY=1
TIMEZONE="Asia/Shanghai"
QUOTA="10T"

# 规则: name|threshold|metric|actions
# actions: notify  run:命令名  shutdown  （逗号分隔）
# RULE_1="warn|6.5T|up|notify"
# RULE_2="stop-app|6.5T|up|notify,run:stop_heavy_app"
# RULE_3="poweroff|8T|up|notify,shutdown"

# 命名命令（规则中 run:stop_heavy_app 对应这里）
# CMD_stop_heavy_app="/root/address/app/ops/stop.sh"

TG_ENABLED=0
TG_BOT_TOKEN=""
TG_CHAT_ID=""
TG_ENDPOINT="https://api.telegram.org/bot"

MAIL_ENABLED=0
MAIL_HOST=""
MAIL_PORT=465
MAIL_USE_SSL=1
MAIL_USER=""
MAIL_PASS=""
MAIL_FROM=""
MAIL_TO=""

SHUTDOWN_ENABLED=1
SHUTDOWN_CMD="/sbin/shutdown -h now"
SHUTDOWN_DELAY=30
DRY_RUN=0
CHECK_INTERVAL_MIN=5
