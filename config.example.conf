# VPS Traffic Monitor — 配置模板
# 一般直接用菜单操作即可；此文件仅作参考
# 复制: cp config.example.conf /root/vps-traffic-monitor/config.conf

INSTANCE_NAME="my-vps"
INTERFACE=""
METRIC="up"
RESET_DAY=1
TIMEZONE="Asia/Shanghai"
QUOTA="10T"

# 规则由菜单 [1] 向导添加，格式: 名称|阈值|方向|动作
# 动作: notify 必有；可选 stop_address、shutdown
# RULE_1="stop-app|6.5T|up|notify,stop_address"
# RULE_2="poweroff|8T|up|notify,shutdown"

TG_ENABLED=0
TG_BOT_TOKEN=""
TG_CHAT_ID=""
TG_ENDPOINT="https://api.telegram.org/bot"

MAIL_ENABLED=0
MAIL_HOST=""
MAIL_PORT=465
MAIL_USE_SSL=1
MAIL_USER=""
MAIL_PASS=""
MAIL_FROM=""
MAIL_TO=""

SHUTDOWN_ENABLED=1
SHUTDOWN_CMD="/sbin/shutdown -h now"
SHUTDOWN_DELAY=30
ADDRESS_STOP_CMD="/root/address/app/ops/stop.sh"
DRY_RUN=0
CHECK_INTERVAL_MIN=5
MENU_KEY="m"
