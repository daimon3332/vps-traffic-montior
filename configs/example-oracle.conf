# 示例：甲骨文等「只算出站」月流量 10T
# 6.5T → 通知 + 停止 address
# 8T   → 通知 + 关机
#
# 用法：复制到目标机配置路径
#   cp configs/example-oracle.conf /root/vps-traffic-monitor/config.conf
# 然后填入 Telegram / 邮件密钥，菜单 [8] 安装定时任务

INSTANCE_NAME="oracle-arm-main"
INTERFACE=""
METRIC="up"
RESET_DAY=1
TIMEZONE="Asia/Shanghai"
QUOTA="10T"

RULE_1="stop-app|6.5T|up|notify,run:stop_heavy_app"
RULE_2="poweroff|8T|up|notify,shutdown"

CMD_stop_heavy_app="/root/address/app/ops/stop.sh"

TG_ENABLED=0
TG_BOT_TOKEN=""
TG_CHAT_ID=""
TG_ENDPOINT="https://api.telegram.org/bot"

MAIL_ENABLED=0
MAIL_HOST=""
MAIL_PORT=465
MAIL_USE_SSL=1
MAIL_USER=""
MAIL_PASS=""
MAIL_FROM=""
MAIL_TO=""

SHUTDOWN_ENABLED=1
SHUTDOWN_CMD="/sbin/shutdown -h now"
SHUTDOWN_DELAY=30
DRY_RUN=0
CHECK_INTERVAL_MIN=5
