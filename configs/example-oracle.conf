# Oracle 出站示例（10T 月配额）
# 6.5T → 通知 + 停 address
# 8T   → 通知 + 关机
# 建议优先用菜单 [1] 按向导添加，不必手抄
# 安装前已用流量可通过菜单 [7] 校准

INSTANCE_NAME="oracle-arm-main"
INTERFACE=""
METRIC="up"
RESET_DAY=1
TIMEZONE="Asia/Shanghai"
QUOTA="10T"

RULE_1="stop-app|6.5T|up|notify,stop_address"
RULE_2="poweroff|8T|up|notify,shutdown"

TG_ENABLED=0
TG_BOT_TOKEN=""
TG_CHAT_ID=""
TG_ENDPOINT="https://api.telegram.org/bot"

MAIL_ENABLED=0
MAIL_HOST=""
MAIL_PORT=465
MAIL_USE_SSL=1
MAIL_USER=""
MAIL_PASS=""
MAIL_FROM=""
MAIL_TO=""

SHUTDOWN_ENABLED=1
SHUTDOWN_CMD="/sbin/shutdown -h now"
SHUTDOWN_DELAY=30
ADDRESS_STOP_CMD="/root/address/app/ops/stop.sh"
DRY_RUN=0
CHECK_INTERVAL_MIN=5
MENU_KEY="m"
